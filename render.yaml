# Render Blueprint. In Render: New → Blueprint → pick this GitHub repo.
# Secrets are never stored here: values marked `sync: false` are entered in the Render dashboard.
services:
  - type: web
    name: gusty-web
    runtime: node
    region: frankfurt # EU, to sit close to the Supabase EU project (GDPR)
    plan: free # sleeps when idle; switch to "starter" (~$7/month) before real users arrive
    branch: main
    # Runs the exact pnpm version from package.json via npx, so the build needs no global
    # install (corepack can be blocked on Render) and can't hit a pnpm version mismatch.
    buildCommand: npx -y pnpm@10.28.0 install --frozen-lockfile && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # The public address, used for links in emails, canonical URLs and the sitemap.
      # Visits to the Render address are sent here too (see src/proxy.ts).
      - key: NEXT_PUBLIC_SITE_URL
        value: https://heygusty.com
      # Public by design (protected by Row Level Security). Read at build time.
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://xxordvjyxfjkidfenqla.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_dhsDmLb3KRSmhnGLJ3wwIw_jiuxaZem
      # Server-only. Entered in the Render dashboard, never committed.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Cloudflare Turnstile site key (public). Set in the Render dashboard; see docs/SUPABASE_SETUP.md.
      - key: TURNSTILE_SITE_KEY
        sync: false
